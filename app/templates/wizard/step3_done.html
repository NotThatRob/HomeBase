{% extends "wizard/base.html" %}

{% block wizard %}
<div class="bg-surface-container-lowest rounded-2xl p-10">
    <div class="text-center mb-8">
        <span class="material-symbols-outlined text-6xl text-primary mb-2">check_circle</span>
        <h1 class="text-3xl font-extrabold text-on-surface tracking-tight font-headline mb-2">
            Nice &mdash; {{ asset.name }} is in HomeBase.
        </h1>
        <p class="text-on-surface-variant max-w-md mx-auto">
            Want to log a recent service or repair for it? It takes 15 seconds and gives your cost charts something to chew on.
        </p>
    </div>

    <form method="post" action="/wizard/service-record/{{ asset.id }}" class="space-y-5 max-w-lg mx-auto">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <div>
            <label for="title" class="block text-sm font-medium text-on-surface mb-1">What was done?</label>
            <input type="text" id="title" name="title" required
                   placeholder="e.g. Oil change, New tires, Filter replacement"
                   class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="service_date" class="block text-sm font-medium text-on-surface mb-1">Date</label>
                <input type="date" id="service_date" name="service_date"
                       class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/40 transition-all">
            </div>
            <div>
                <label for="cost" class="block text-sm font-medium text-on-surface mb-1">Cost</label>
                <input type="number" id="cost" name="cost" step="0.01" min="0"
                       class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/40 transition-all">
            </div>
        </div>

        <div>
            <label for="vendor" class="block text-sm font-medium text-on-surface mb-1">Vendor (optional)</label>
            <input type="text" id="vendor" name="vendor"
                   placeholder="e.g. Jiffy Lube"
                   class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/40 transition-all">
        </div>

        <div class="pt-4">
            <button type="submit"
                    class="w-full signature-cta text-on-primary rounded-xl px-6 py-3 inline-flex items-center justify-center gap-2 font-bold hover:opacity-90 transition-all">
                Save and finish
                <span class="material-symbols-outlined">check</span>
            </button>
        </div>
    </form>

    <form method="post" action="/wizard/complete" class="mt-3 max-w-lg mx-auto">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button type="submit"
                class="w-full py-3 px-6 bg-surface-container-high text-on-surface-variant rounded-xl font-semibold hover:bg-surface-container-highest transition-colors">
            Finish without one
        </button>
    </form>
</div>
{% endblock %}
