<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeBase</title>
    <link rel="stylesheet" href="/static/css/homebase.css">
    <script src="/static/js/icons.js" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-surface relative overflow-hidden">
    <!-- Atmospheric background elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-primary-container/30 blur-3xl float"></div>
        <div class="absolute -bottom-48 -left-24 w-80 h-80 rounded-full bg-primary-container/20 blur-3xl float" style="animation-delay: -3s;"></div>
    </div>

    <div class="w-full max-w-sm mx-4 relative z-10">
        <!-- Logo + title -->
        <div class="text-center mb-10 animate-entrance">
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-primary flex items-center justify-center shadow-xl shadow-primary/25">
                <span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">home_storage</span>
            </div>
            <h1 class="text-3xl font-extrabold text-on-surface font-headline tracking-tight">HomeBase</h1>
            <p class="text-sm text-on-surface-variant mt-1.5">Personal Asset Management</p>
        </div>

        <!-- Login card -->
        <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm animate-entrance delay-1">
            {% if error %}
            <div class="mb-5 px-4 py-3 bg-red-50 text-red-700 text-sm rounded-xl flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">error</span>
                {{ error }}
            </div>
            {% endif %}
            <form method="post" action="/login" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <div class="animate-entrance delay-2">
                    <label for="username" class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                        class="w-full px-4 py-3 bg-surface-container-highest border-none rounded-xl text-sm text-on-surface transition-all placeholder:text-outline-variant"
                        placeholder="Enter your username">
                </div>
                <div class="animate-entrance delay-2">
                    <label for="password" class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 bg-surface-container-highest border-none rounded-xl text-sm text-on-surface transition-all placeholder:text-outline-variant"
                        placeholder="Enter your password">
                </div>
                <button type="submit"
                    class="w-full py-3 bg-gradient-to-br from-primary to-[#0b50d5] text-on-primary font-bold rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all text-sm animate-entrance delay-3 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">login</span>
                    Sign In
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-on-surface-variant/50 mt-8 animate-entrance delay-3">
            HomeBase v0.2.0
        </p>
    </div>
</body>
</html>
