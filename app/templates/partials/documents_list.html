{% if documents %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    {% for doc in documents %}
    {% include "partials/document_card.html" %}
    {% endfor %}
</div>
{% else %}
<div class="bg-surface-container-lowest p-8 rounded-2xl text-center">
    <span class="material-symbols-outlined text-5xl text-outline-variant mb-3">folder_open</span>
    <p class="text-on-surface-variant">No documents yet.</p>
</div>
{% endif %}
