<a href="{{ item.href }}"
   class="flex items-start gap-4 p-4 rounded-xl hover:bg-surface-container-low transition-colors duration-200 group">
    <div class="flex-shrink-0 w-10 h-10 rounded-full
                {% if item.kind == 'service' %}bg-primary-container text-on-primary-container{% else %}bg-tertiary-container text-on-tertiary-container{% endif %}
                flex items-center justify-center">
        <span class="material-symbols-outlined text-xl">
            {% if item.kind == 'service' %}build_circle{% else %}description{% endif %}
        </span>
    </div>
    <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-3">
            <p class="font-semibold text-on-surface truncate group-hover:text-primary transition-colors">
                {{ item.title }}
            </p>
            <span class="text-xs text-on-surface-variant whitespace-nowrap">
                {{ item.when | compact_date }}
            </span>
        </div>
        <p class="text-sm text-on-surface-variant truncate">
            {{ item.asset_name }}{% if item.user_name %} · {{ item.user_name }}{% endif %}
        </p>
    </div>
</a>
